name: CI

# NOT ACTIVE. To activate: copy it to `.github/workflows/ci.yml` from a normal
# git client. The Claude GitHub App cannot push files under `.github/workflows/`
# (docs/SCRAPING_HURDLES.md row 14) — a push carrying that path is rejected with
# "refusing to allow a GitHub App to create or update workflow ... without
# `workflows` permission", verified on 2026-09-17. This is the same reason
# workflows/refresh.yml sits here, but for the opposite purpose: refresh.yml is
# parked deliberately and must stay parked; this file is parked only by that
# permission limit and should be copied in.
#
# The commit gate. Runs `make check` — pytest, every Node suite under tests/,
# and both generated-output staleness checks.
#
# Read-only by design: no scheduled trigger, no deploy, no write to data/ or to
# any generated output, and `permissions: contents: read`. The seasonal scrape
# in workflows/refresh.yml is a separate, deliberately inactive file; do not
# activate it from here (`make refresh` has destructive and stale-cache failure
# paths recorded in docs/AUDIT-2026-09-10.md).
#
# push is limited to main and pull_request covers the rest: a push to a branch
# with an open PR would otherwise run this twice under two concurrency groups.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: a cancelled run leaves a merged commit with no verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: demo/carnegie-hall/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        # The same recipe a developer runs, so the two cannot drift.
        run: make venv

      - name: Install demo Node dependencies
        # tests/carnegie_demo.test.cjs runs demo/carnegie-hall/build.cjs, which
        # requires the docx package. `make check` installs this itself through
        # its node-deps prerequisite; doing it here as well keeps an install
        # failure separate in the log from a test failure.
        run: make node-deps

      - name: make check
        run: make check
